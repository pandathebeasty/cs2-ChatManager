name: Build and Publish

on:
  workflow_dispatch:

env:
  PROJECT_NAME: "ChatManager"
  PROJECT_PATH: "./ChatManager/ChatManager.csproj"
  API_PROJECT_PATH: "./ChatManagerApi/ChatManagerApi.csproj"
  OUTPUT_PATH: "./counterstrikesharp"
  TMP_PATH: "./tmp"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    outputs:
      build_version: ${{ steps.version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Get Plugin Version
        id: version
        run: |
          VERSION=$(grep "ModuleVersion =>" ChatManager/ChatManager.cs | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Restore ChatManager
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build ChatManager
        run: |
          dotnet build ${{ env.PROJECT_PATH }} \
            -c Release \
            -o ${{ env.TMP_PATH }}/ChatManager

      - name: Restore ChatManagerApi
        run: dotnet restore ${{ env.API_PROJECT_PATH }}

      - name: Build ChatManagerApi
        run: |
          dotnet build ${{ env.API_PROJECT_PATH }} \
            -c Release \
            -o ${{ env.TMP_PATH }}/ChatManagerApi

      - name: Package Plugin
        run: |
          mkdir -p ${{ env.OUTPUT_PATH }}/plugins/ChatManager
          mkdir -p ${{ env.OUTPUT_PATH }}/shared/ChatManagerApi

          cp -r ${{ env.TMP_PATH }}/ChatManager/* \
            ${{ env.OUTPUT_PATH }}/plugins/ChatManager/

          cp -r ${{ env.TMP_PATH }}/ChatManagerApi/* \
            ${{ env.OUTPUT_PATH }}/shared/ChatManagerApi/

      - name: Create ZIP
        run: |
          zip -r \
            ChatManager-${{ steps.version.outputs.VERSION }}.zip \
            ${{ env.OUTPUT_PATH }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Artifacts
          path: ChatManager-${{ steps.version.outputs.VERSION }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: Build-Artifacts
          path: .

      - name: Publish Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: ChatManager-${{ needs.build.outputs.build_version }}.zip
          tag: v${{ needs.build.outputs.build_version }}
          name: ChatManager v${{ needs.build.outputs.build_version }}
          allowUpdates: true
          body: |
            Installation

            Extract the archive into:

            addons/counterstrikesharp/

            This package includes:
            - plugins/ChatManager
            - shared/ChatManagerApi

            The plugin will be loaded automatically by CounterStrikeSharp.

            Restart or reload the server after installation.
